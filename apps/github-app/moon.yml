$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "application"
tags:
  - "github"
  - "app"
  - "surface"

dependsOn:
  - "core"

tasks:
  build:
    command: "tsdown"
    args:
      - "src/index.ts"
      - "--out-dir"
      - "dist"
      - "--format"
      - "esm"
      - "--dts"
      - "--sourcemap"
      - "--platform"
      - "node"
      - "--target"
      - "node20"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"
    outputs:
      - "dist"

  lint:
    command: "oxlint"
    args: ["--deny-warnings", "src", "tests"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"

  test:
    command: "cucumber-js"
    args:
      - "--import"
      - "../../packages/bdd-utils/src/world.ts"
      - "--import"
      - "tests/bdd/**/*.ts"
      - "tests/bdd/**/*.feature"
    deps:
      - "core:build"
      - "~:build"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "package.json"
      - "tsconfig.json"
      - "/packages/bdd-utils/**/*"

  typecheck:
    command: "tsgo"
    args: ["-p", "tsconfig.json", "--noEmit"]
    deps:
      - "^:typecheck"
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"

  format:
    command: "oxfmt"
    args: ["--write", "src", "tests", "package.json", "tsconfig.json"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"

  format-check:
    command: "oxfmt"
    args: ["--check", "src", "tests", "package.json", "tsconfig.json"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"
