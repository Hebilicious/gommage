$schema: "https://moonrepo.dev/schemas/project.json"

language: "bash"
layer: "tool"
tags:
  - "shell"
  - "surface"

tasks:
  test:
    command: "cucumber-js"
    args:
      - "--import"
      - "../../packages/bdd-utils/src/world.ts"
      - "--import"
      - "tests/bdd/**/*.ts"
      - "tests/bdd/**/*.feature"
    inputs:
      - "gommage.sh"
      - "tests/**/*"
      - "package.json"
      - "/packages/bdd-utils/**/*"

  lint:
    command: "oxlint"
    args: ["--deny-warnings", "tests"]
    inputs:
      - "tests/**/*"
      - "package.json"
      - "tsconfig.json"

  typecheck:
    command: "tsc"
    args: ["-p", "tsconfig.json", "--noEmit"]
    inputs:
      - "tests/**/*"
      - "package.json"
      - "tsconfig.json"

  format:
    command: "oxfmt"
    args: ["--write", "tests", "package.json", "tsconfig.json"]
    inputs:
      - "tests/**/*"
      - "package.json"
      - "tsconfig.json"

  format-check:
    command: "oxfmt"
    args: ["--check", "tests", "package.json", "tsconfig.json"]
    inputs:
      - "tests/**/*"
      - "package.json"
      - "tsconfig.json"
