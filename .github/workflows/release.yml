name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate workspace
        run: moon run :build :test :lint :typecheck :format-check
      - name: Use npm trusted publishing client
        run: |
          npm install --global npm@latest
          npm --version
      - name: Create release PR or publish
        uses: changesets/action@v1.8.0
        with:
          version: moon run --affected false release:version
          publish: moon run --affected false release:publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
