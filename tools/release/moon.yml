$schema: "https://moonrepo.dev/schemas/project.json"

language: "javascript"
layer: "tool"
tags:
  - "release"
  - "changesets"

tasks:
  changeset:
    command: "changeset"
    inputs:
      - "/.changeset/**/*"
      - "/package.json"
      - "/pnpm-workspace.yaml"
      - "/packages/**/*"
      - "/apps/**/*"
      - "/website/**/*"
      - "package.json"
      - "moon.yml"

  status:
    command: "changeset"
    args: ["status"]
    inputs:
      - "/.changeset/**/*"
      - "/package.json"
      - "/pnpm-workspace.yaml"
      - "/packages/**/*"
      - "/apps/**/*"
      - "/website/**/*"

  version:
    command: "changeset"
    args: ["version"]
    inputs:
      - "/.changeset/**/*"
      - "/package.json"
      - "/pnpm-workspace.yaml"
      - "/packages/**/*"
      - "/apps/**/*"
      - "/website/**/*"

  publish:
    command: "node"
    args: ["src/publish.mjs"]
    deps:
      - "core:build"
      - "cli:build"
      - "cli:test"
    inputs:
      - "/.changeset/**/*"
      - "/package.json"
      - "/pnpm-workspace.yaml"
      - "/packages/core/**/*"
      - "/apps/cli/**/*"
      - "src/**/*"
      - "package.json"
      - "moon.yml"
