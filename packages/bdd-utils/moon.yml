$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "library"
tags:
  - "bdd"
  - "test-utils"

tasks:
  lint:
    command: "oxlint"
    args: ["--deny-warnings", "src"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"
      - "moon.yml"

  typecheck:
    command: "tsgo"
    args: ["-p", "tsconfig.json", "--noEmit"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"

  format:
    command: "oxfmt"
    args: ["--write", "src", "package.json", "tsconfig.json"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"

  format-check:
    command: "oxfmt"
    args: ["--check", "src", "package.json", "tsconfig.json"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"
